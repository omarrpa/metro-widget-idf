# Metro Widget IDF - compilation APK Android dans GitHub Actions, publiée en Release
# Créé par : Omar Pérez - 2026-11-10 07:10
name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clé de signature fixe (mises à jour sans désinstaller)
        run: |
          mkdir -p ~/.android
          cp android/keystore/debug.keystore ~/.android/debug.keystore

      - name: Génération des fichiers Android manquants
        run: flutter create --org com.omarperez --project-name metro_widget --platforms android .

      - run: flutter pub get

      - name: Analyse (non bloquante)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Compilation APK
        run: flutter build apk --release ${{ secrets.PRIM_API_KEY != '' && format('--dart-define=PRIM_API_KEY={0}', secrets.PRIM_API_KEY) || '' }}

      - name: Renommage
        run: cp build/app/outputs/flutter-apk/app-release.apk metro_widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: metro_widget-apk
          path: metro_widget.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Metro Widget v1.0.${{ github.run_number }}
          body: Télécharger metro_widget.apk depuis le téléphone puis l'ouvrir pour installer.
          files: metro_widget.apk
